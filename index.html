<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>gradfit-lab — differentiable mesh fitting, verified against finite differences</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #090b10; color: #e7ecf5;
    font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
  #app { position: fixed; inset: 0; }
  #hud { position: fixed; top: 14px; left: 14px; width: 336px; padding: 14px 16px;
    background: rgba(12,16,24,.9); border: 1px solid #223; border-radius: 10px;
    backdrop-filter: blur(6px); }
  h1 { font-size: 14px; margin: 0 0 2px; letter-spacing: .02em; }
  .sub { color: #7d8aa3; font-size: 11px; margin-bottom: 10px; }
  label { display: block; color: #8fa0bd; font-size: 11px; margin: 10px 0 4px; }
  input[type=range] { width: 100%; accent-color: #59d3a5; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
  td { padding: 2px 0; }
  td.k { color: #8fa0bd; }
  td.v { text-align: right; font-variant-numeric: tabular-nums; }
  .ok { color: #59d3a5; }
  .bad { color: #ff6b81; }
  #verdict { margin-top: 10px; padding: 7px 9px; border-radius: 6px;
    background: #10221c; border: 1px solid #1d4a3a; font-size: 11.5px; }
  #err { position: fixed; bottom: 12px; left: 14px; color: #ff6b81; max-width: 70vw; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <h1>gradfit-lab</h1>
  <div class="sub">analytic gradient vs central finite differences</div>
  <label for="scene">scene</label>
  <select id="scene"></select>
  <label for="iter">iteration <span id="iterLabel">0</span> / 60</label>
  <input id="iter" type="range" min="0" max="60" value="0" step="1" />
  <table>
    <tr><td class="k">energy E</td><td class="v" id="energy">—</td></tr>
    <tr><td class="k">mean |f|</td><td class="v" id="meanabs">—</td></tr>
    <tr><td class="k">E drop</td><td class="v" id="drop">—</td></tr>
    <tr><td class="k">node E at this iter</td><td class="v" id="refe">—</td></tr>
    <tr><td class="k">grad cos vs FD</td><td class="v" id="cos">—</td></tr>
  </table>
  <div id="verdict">loading…</div>
</div>
<div id="err"></div>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
<script type="module" src="./main.js"></script>
</body>
</html>
